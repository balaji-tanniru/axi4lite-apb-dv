name: RTL and automation checks
on: [push, pull_request]
jobs:
 checks:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - run: sudo apt-get update && sudo apt-get install -y verilator iverilog
   - run: verilator --lint-only -Wall -Wno-fatal rtl/axi4lite_to_apb_bridge.sv rtl/apb_memory_slave.sv
   - run: python3 -m py_compile scripts/run_regression.py
   - run: make smoke
